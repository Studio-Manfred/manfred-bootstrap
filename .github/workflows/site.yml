name: Site CI

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read
  packages: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm --prefix site ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: npm --prefix site run typecheck
      - name: Lint
        run: npm --prefix site run lint
      - name: Unit tests
        run: npm --prefix site run test:run
      - name: Build
        run: npm --prefix site run build
      - name: Install Playwright browser
        run: npx --prefix site playwright install --with-deps chromium
      - name: E2E tests
        run: npm --prefix site run test:e2e
